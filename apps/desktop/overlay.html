<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Treen 冻结层</title>
    <style>
      /* 冻结层是透明窗：页面不得绘制任何底色，多出的像素透出桌面而非白底。
         截图按 object-fit: cover 铺满，比例与窗口一致时为精确贴合，永不出现信箱边。 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      :root {
        /* 高亮色在此单点定义；科技向色板的集中定稿属渲染样式切片，届时只需改这一处。 */
        --treen-highlight: rgba(8, 174, 236, 0.95);
        --treen-highlight-fill: rgba(8, 174, 236, 0.12);
        /* 锁定态与悬停态同色系不同强度：锁定是已提交的选区，必须比悬停更实、且在被悬停
           别的候选时仍然留着，否则用户看不出自己锁了哪一块。 */
        --treen-locked: rgba(126, 226, 255, 0.98);
        --treen-locked-fill: rgba(8, 174, 236, 0.32);
        /* 覆盖层配色：与渲染站科技向主题同族（深底、青色描边、亮色文字）。释义与图各自成层，
           都盖在冻结画面上。色值集中在此，覆盖层改色只动这一处。 */
        --treen-overlay-bg: rgba(10, 14, 20, 0.86);
        --treen-overlay-text: #cde7ff;
        --treen-overlay-border: rgba(34, 184, 230, 0.35);
        --treen-overlay-clipped: rgba(255, 138, 76, 0.6);
      }

      #treen-freeze-frame {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      /* 候选区域层：自身不吃事件，命中判定交给每个候选条自己（见下方布局说明）。 */
      #treen-candidates {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /*
        候选区域条。默认态保留一条等宽透明边框，命中态只换颜色：
        边框从无到有会改变盒模型尺寸，让边框线在切换时跳动一下；预置透明边框后两种状态
        几何完全一致，命中只改颜色，不可能产生位移（透明边框占位纪律）。
        位置与尺寸由主进程按显示器相对 DIP 写入，与窗口内 CSS px 同尺度。
      */
      .treen-candidate {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid transparent;
        background-color: transparent;
        pointer-events: auto;
      }

      .treen-candidate[data-hit="true"] {
        border-color: var(--treen-highlight);
        background-color: var(--treen-highlight-fill);
      }

      /* 锁定规则排在悬停之后：同一元素同时被悬停与选中时锁定态胜出（同特异度后写者赢），
         否则鼠标划过锁定的那块时它会「变淡」，看起来像被取消。 */
      .treen-candidate[data-locked="true"] {
        border-color: var(--treen-locked);
        background-color: var(--treen-locked-fill);
      }

      /*
        覆盖层：译文与图表的落点，由主进程算好整批送来（见 src/overlay）。
        整层 pointer-events: none——覆盖物只是显示面，点击要继续命中下方的候选条，
        否则译出一块之后就无法再框选别的区域。位置与尺寸全部由送来的盒子给定，
        渲染层不做任何几何计算。
      */
      #treen-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* 一段译文的版位：盒子即 OCR 包围盒。底色压住原始文字（原位覆盖的语义），
         折行已由主进程算好，这里只需按行输出。 */
      /*
        译文盒。描边用 outline 而非 border：主进程的折行按盒宽算内容宽度，border 会占掉内容区
        （box-sizing: border-box 下每边 1px），行末字符被 overflow: hidden 切掉一截；outline 不参与
        布局，盒内可用宽度就等于送来的宽度。代价是描边画在盒子外沿 1px，覆盖层整体 pointer-events: none
        且底色透明，这 1px 只影响观感。
      */
      .treen-overlay-text {
        position: absolute;
        overflow: hidden;
        background-color: var(--treen-overlay-bg);
        color: var(--treen-overlay-text);
        outline: 1px solid var(--treen-overlay-border);
        border-radius: 2px;
      }

      /* 达最小字号仍放不下时按裁剪呈现，用描边色提示「这块没显示全」。 */
      .treen-overlay-text[data-clipped="true"] {
        outline-color: var(--treen-overlay-clipped);
      }

      .treen-overlay-line {
        display: block;
        white-space: pre;
      }

      /* 一张图的版位：SVG 由主进程按 contain 缩放，这里只承载它。 */
      .treen-overlay-chart {
        position: absolute;
      }

      .treen-overlay-chart svg {
        display: block;
      }

      /*
        翻译 loading 层：锁定区域上一条自上而下循环扫过的扫描线（DOM/CSS，不引入 WebGL）。
        层由主进程按锁定区域摆位（显示器相对 DIP），显隐翻 hidden。位移用 top 百分比动画——
        transform 的百分比参照伪元素自身高度，按区域高度自适应只能靠包含块百分比。

        扫描体是一条带拖尾的彗尾而不是 1px 细线：深色冻结画面上细线几乎看不见，故给下方 2px 亮芯
        叠两层辉光（近处锐、远处散），上方挂一段占区域高 22% 的渐隐尾，一次动画把整条彗尾从区域
        上方扫到下方。层本身再加极淡底色与内描边，让「正在处理的区域」不靠线也能一眼认出。
        描边用 box-shadow 而非 border，不改变盒模型，层显隐不会有位移。配色沿用锁定色变量。
      */
      #treen-loading {
        position: absolute;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(34, 184, 230, 0.05), rgba(34, 184, 230, 0.1));
        box-shadow: inset 0 0 0 2px var(--treen-locked);
      }

      #treen-loading[hidden] {
        display: none;
      }

      #treen-loading::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 22%;
        background: linear-gradient(180deg, transparent 40%, var(--treen-locked) 100%);
        border-bottom: 2px solid var(--treen-locked);
        box-shadow: 0 0 20px 3px var(--treen-locked), 0 0 64px 12px var(--treen-locked);
        animation: treen-loading-scan 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      @keyframes treen-loading-scan {
        from {
          top: -22%;
        }

        to {
          top: 100%;
        }
      }

      /*
        降低动效偏好下不再循环扫：亮芯停在区域中部。闪烁是这条效果最容易引起不适的部分，
        而「正在处理」这个信息靠静止的亮芯与描边仍在，故去掉的是动画而不是提示。
      */
      @media (prefers-reduced-motion: reduce) {
        #treen-loading::after {
          animation: none;
          top: 50%;
        }
      }
    </style>
  </head>
  <body>
    <!-- 冻结画面容器；data-testid 供真链路 smoke 定位与后续切片复用 -->
    <img id="treen-freeze-frame" data-testid="freeze-frame" alt="" />
    <!-- 候选区域容器：一屏内所有可选中区域，悬停命中者加 data-hit -->
    <div id="treen-candidates" data-testid="freeze-candidates"></div>
    <!-- 覆盖渲染层：译文与 mermaid 图的落点，内容由主进程随翻译结果注入 -->
    <div id="treen-overlay" data-testid="freeze-overlay"></div>
    <!-- 翻译 loading 层：点击锁定后到覆盖落地前，主进程把扫描线摆到锁定区域上 -->
    <div id="treen-loading" data-testid="freeze-loading" hidden></div>
    <script>
      // 主进程在截图就绪后经 executeJavaScript 调用。挂在 window 上而非模块作用域，
      // 才能被 executeJavaScript 的全局求值命中；source 是 PNG data URL。
      window.__treenSetFrame = function (dataUrl) {
        var img = document.getElementById('treen-freeze-frame')
        if (img && typeof dataUrl === 'string' && dataUrl.length > 0) {
          img.src = dataUrl
        }
      }

      var candidateLayer = document.getElementById('treen-candidates')
      var hitElement = null
      var lockedElement = null
      var lockedRect = null

      /**
       * 命中判定：候选条自己吃指针事件（父层 pointer-events: none），浏览器给出的命中结果
       * 就是层叠在最上面的那条，即最具体的候选。悬停与点击共用它，两处判定不会各自漂移。
       */
      function hitTest(x, y) {
        var element = document.elementFromPoint(x, y)
        return element && element.classList && element.classList.contains('treen-candidate')
          ? element
          : null
      }

      function clearHit() {
        if (hitElement !== null) {
          hitElement.removeAttribute('data-hit')
          hitElement = null
        }
      }

      /**
       * 锁定选区的几何取自候选条自己的样式值，那正是主进程注入的显示器相对 DIP；
       * 改用 getBoundingClientRect 会把窗口的缩放与偏移掺进来，主进程照它裁像素就会偏。
       */
      function candidateRect(element) {
        return {
          x: parseFloat(element.style.left),
          y: parseFloat(element.style.top),
          width: parseFloat(element.style.width),
          height: parseFloat(element.style.height),
        }
      }

      function clearLock() {
        if (lockedElement !== null) {
          lockedElement.removeAttribute('data-locked')
          lockedElement = null
        }
        lockedRect = null
      }

      function lock(element) {
        if (element === lockedElement) {
          return
        }
        clearLock()
        element.setAttribute('data-locked', 'true')
        lockedElement = element
        lockedRect = candidateRect(element)
      }

      /** 主进程读取当前锁定选区的唯一入口：拷贝原始像素现在用它，后续 OCR 也用它。 */
      window.__treenGetLocked = function () {
        if (lockedRect === null) {
          return null
        }
        return {
          x: lockedRect.x,
          y: lockedRect.y,
          width: lockedRect.width,
          height: lockedRect.height,
        }
      }

      /**
       * 候选区域由主进程算好后整批送来：数组已按面积降序，小矩形在后、z-index 更大。
       * 这个次序就是选中策略——层叠在上的是最具体的那条，浏览器自带的命中测试于是
       * 直接给出「当前命中的候选区域」，渲染层不需要自己实现一套矩形包含判定。
       */
      window.__treenSetCandidates = function (candidates) {
        clearHit()
        // 候选整批换新后，先前锁定的那条已经不在文档里，留着它只会让读取面指向幽灵元素。
        clearLock()
        candidateLayer.replaceChildren()
        if (!Array.isArray(candidates)) {
          return
        }
        for (var i = 0; i < candidates.length; i++) {
          var candidate = candidates[i]
          if (
            !candidate ||
            typeof candidate.x !== 'number' ||
            typeof candidate.y !== 'number' ||
            typeof candidate.width !== 'number' ||
            typeof candidate.height !== 'number'
          ) {
            continue
          }
          var rect = document.createElement('div')
          rect.className = 'treen-candidate'
          rect.setAttribute('data-testid', 'freeze-candidate')
          rect.setAttribute('data-source', String(candidate.source || 'edge'))
          rect.setAttribute('data-index', String(i))
          rect.style.zIndex = String(i)
          rect.style.left = candidate.x + 'px'
          rect.style.top = candidate.y + 'px'
          rect.style.width = candidate.width + 'px'
          rect.style.height = candidate.height + 'px'
          candidateLayer.appendChild(rect)
        }
      }

      var overlayLayer = document.getElementById('treen-overlay')

      /** 覆盖盒是否可用：四个数值齐全且尺寸为正。跨进程送来的数据先验形状再用。 */
      function isOverlayBox(item) {
        return (
          item &&
          typeof item.x === 'number' &&
          typeof item.y === 'number' &&
          typeof item.width === 'number' &&
          typeof item.height === 'number' &&
          item.width > 0 &&
          item.height > 0
        )
      }

      /** 把覆盖盒的位置与尺寸落到绝对定位元素的样式上（显示器相对 DIP，与窗口内 CSS px 同尺度）。 */
      function placeOverlayBox(element, item) {
        element.style.left = item.x + 'px'
        element.style.top = item.y + 'px'
        element.style.width = item.width + 'px'
        element.style.height = item.height + 'px'
      }

      /**
       * 用 DOMParser 解析 SVG 再 importNode 进来，而不是直接 innerHTML：解析出的文档是惰性的，
       * 不会在解析阶段执行任何脚本。SVG 来自本地渲染站，且 mermaid 以 securityLevel: strict 产出，
       * 这层是纵深防御的第二道（第一道是渲染侧的消毒与 init 指令剥离）。
       */
      function mountSvg(container, svgText, width, height) {
        var parsed = new DOMParser().parseFromString(svgText, 'image/svg+xml')
        var svg = parsed.documentElement
        if (!svg || svg.nodeName.toLowerCase() !== 'svg') {
          return false
        }
        // mermaid 可能给根 svg 带 max-width 之类内联样式，用 important 强制承载尺寸，
        // 保证它正好铺满这个已按 contain 算好的盒子。
        svg.style.setProperty('width', width + 'px', 'important')
        svg.style.setProperty('height', height + 'px', 'important')
        container.appendChild(document.importNode(svg, true))
        return true
      }

      /**
       * 主进程把算好的覆盖计划整批送来：texts 是译文版位（含已折行的行数组与字号），
       * charts 是图版位（含已渲染的 SVG）。渲染层不做任何几何计算，只落样式——
       * 字号自适应、折行、contain 适配都已在主进程的纯逻辑里完成并被单测覆盖。
       */
      window.__treenSetOverlay = function (plan) {
        overlayLayer.replaceChildren()
        if (!plan || typeof plan !== 'object') {
          return
        }
        var fontFamily = typeof plan.fontFamily === 'string' ? plan.fontFamily : ''
        var charts = Array.isArray(plan.charts) ? plan.charts : []
        for (var c = 0; c < charts.length; c++) {
          var chart = charts[c]
          if (!isOverlayBox(chart) || typeof chart.svg !== 'string') {
            continue
          }
          var holder = document.createElement('div')
          holder.className = 'treen-overlay-chart'
          holder.setAttribute('data-testid', 'freeze-chart')
          placeOverlayBox(holder, chart)
          if (mountSvg(holder, chart.svg, chart.width, chart.height)) {
            overlayLayer.appendChild(holder)
          }
        }

        var texts = Array.isArray(plan.texts) ? plan.texts : []
        for (var t = 0; t < texts.length; t++) {
          var text = texts[t]
          if (!isOverlayBox(text) || !Array.isArray(text.lines)) {
            continue
          }
          var box = document.createElement('div')
          box.className = 'treen-overlay-text'
          box.setAttribute('data-testid', 'freeze-text')
          if (text.clipped) {
            box.setAttribute('data-clipped', 'true')
          }
          placeOverlayBox(box, text)
          if (typeof text.fontSize === 'number') {
            box.style.fontSize = text.fontSize + 'px'
          }
          if (typeof text.lineHeight === 'number') {
            box.style.lineHeight = text.lineHeight + 'px'
          }
          if (fontFamily !== '') {
            box.style.fontFamily = fontFamily
          }
          for (var l = 0; l < text.lines.length; l++) {
            var line = document.createElement('div')
            line.className = 'treen-overlay-line'
            line.setAttribute('data-testid', 'freeze-text-line')
            line.textContent = String(text.lines[l])
            box.appendChild(line)
          }
          overlayLayer.appendChild(box)
        }
      }

      /**
       * 翻译 loading 的显隐：主进程在翻译链路发起时把层摆到锁定区域上，链路终结时按区域收线。
       * 层每屏一份、由最新一次点击拥有——loadingRect 记下层上正显示的区域，收线请求只在
       * 「层上正是这个区域」时生效：同屏连点两块时，先完成的旧链收不到新链正在扫的线，
       * 也不至于把新链的线一并带走。形状不合的 rect 一律当隐藏处理，不残留旧位置。
       */
      var loadingLayer = document.getElementById('treen-loading')
      var loadingRect = null

      function loadingRectEquals(rect) {
        return (
          loadingRect !== null &&
          rect.x === loadingRect.x &&
          rect.y === loadingRect.y &&
          rect.width === loadingRect.width &&
          rect.height === loadingRect.height
        )
      }

      window.__treenSetLoading = function (rect) {
        var valid =
          rect &&
          typeof rect.x === 'number' &&
          typeof rect.y === 'number' &&
          typeof rect.width === 'number' &&
          typeof rect.height === 'number'
        if (!valid) {
          loadingRect = null
          loadingLayer.hidden = true
          return
        }
        loadingRect = { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
        loadingLayer.style.left = rect.x + 'px'
        loadingLayer.style.top = rect.y + 'px'
        loadingLayer.style.width = rect.width + 'px'
        loadingLayer.style.height = rect.height + 'px'
        loadingLayer.hidden = false
      }

      window.__treenClearLoading = function (rect) {
        if (!loadingRectEquals(rect)) {
          return
        }
        loadingRect = null
        loadingLayer.hidden = true
      }

      /**
       * 悬停高亮。用 elementFromPoint 而非 CSS :hover，是因为命中结果需要可被观测与断言
       * （真链路 smoke 靠合成 mousemove 读数），后续「点击锁定候选区域」也要复用同一个命中判定。
       */
      document.addEventListener('mousemove', function (event) {
        var next = hitTest(event.clientX, event.clientY)
        if (next === hitElement) {
          return
        }
        clearHit()
        if (next !== null) {
          next.setAttribute('data-hit', 'true')
          hitElement = next
        }
      })

      /**
       * 点击即锁定当前命中的候选。点在空白处不改动已有锁定：取消的语义归 Escape 与
       * 再次触发冻结热键，误点一下不该把已经选好的区域丢掉。
       */
      document.addEventListener('click', function (event) {
        var element = hitTest(event.clientX, event.clientY)
        if (element !== null) {
          lock(element)
        }
      })
    </script>
  </body>
</html>
